<script>
"use strict";
// =====================================================================
//  RECEITA FELINA — REALISM LAB. 10s @ 120 BPM, 24fps, 9:16. Three shots of the kitchen from the episode, cut hard:
//  1. Marcella behind the counter talking, Babidi asleep on the shelf, the oil bottle in the foreground.
//  2. Close on the counter: her hands, the bowl and whisk, the bottle.
//  3. Babidi wakes, stretches on the shelf.
//  The lab for the realism layers: build it with "relight" on and off (piece.json) and compare the stills.
// =====================================================================
const FORMATS = { '9:16': [1080, 1920], '4:5': [1080, 1350], '1:1': [1080, 1080], '16:9': [1920, 1080] };
const FORMAT = new URLSearchParams(location.search).get('format') || '9:16';
const FPS = 24, [W, H] = FORMATS[FORMAT];
{ const cv = document.getElementById('c'); cv.width = W; cv.height = H; }
const BPM = typeof BEATS !== 'undefined' ? BEATS.bpm : 120, GRID0 = typeof BEATS !== 'undefined' ? BEATS.offset : 0;
const BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 10.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { '9:16': { top: 240, bottom: 420, right: 140 }, '4:5': { top: 80, bottom: 160, right: 60 }, '1:1': { top: 60, bottom: 110, right: 60 }, '16:9': { top: 60, bottom: 110, right: 60 } }[FORMAT];
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';
const CX = (W - SAFE.right) / 2;
const onBeat = (t) => +(GRID0 + Math.round((t - GRID0) / E8) * E8).toFixed(4);
const C1 = onBeat(4.0), C2 = onBeat(7.0);
const ERA_LIST = [[0, C1, () => sceneCounter()], [C1, C2, () => sceneHands()], [C2, DURATION, () => sceneShelf()]];
const SHOTS = [
  ['counter', 0, 0.0, C1, 'Marcella talks behind the counter; Babidi asleep on the shelf'],
  ['hands',   1, C1,  C2, 'close on the counter: hands, bowl, whisk, the bottle'],
  ['shelf',   2, C2,  DURATION, 'Babidi wakes and stretches'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'beat-cut',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [C1, C2],
  morphs: [],
  cues: { grab: onBeat(5.0), wake: onBeat(7.5), stretch: onBeat(8.25) },
  acts: [
    { name: '1 Counter', role: 'build', t0: 0.0, t1: C1 },
    { name: '2 Hands', role: 'journey', t0: C1, t1: C2 },
    { name: '3 Shelf', role: 'gift', t0: C2, t1: DURATION },
  ],
  board: [
    { t: 1.5, title: 'Marcella and Babidi', sound: 'room tone, a soft pad', next: 'cut to the counter' },
    { t: 5.5, title: 'hands, bowl, bottle', sound: 'a whisk ticking', next: 'cut to the shelf' },
    { t: 8.5, title: 'Babidi stretches', sound: 'a little chime', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;

const ERA_BG = ['#a9d9c6', '#c08048', '#a9d9c6'];
